<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/contact.css">
    <link rel="stylesheet" href="./assets/css/contactmedia.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="./assets/js/script.js"></script>
    <title>Contact</title>
</head>
<body>
    <!-- header -->
    <section class="header">
        <div class="container">
            <div class="nav_main">
                <div class="nav_logo">
                    <img src="./assets/images/Frame 4.svg" alt="logo" class="logo">
                </div>
                <div class="menu_toggle" id="menu-toggle">&#9776;</div>
                <div class="nav_menu" id="nav-menu">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="portfolio.html">Portfolio</a></li>
                        <li><a href="service.html">Services</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
    <!-- form -->
    <div class="form">
        <div class="container">
            <div class="form_txt">
                <h1 class="contact">Contact Us</h1>
                <h5 class="contact_h5">Lorem ipsum, dolor sit amet consectetur <br>
                    adipisicing elit.</h5>
            </div>
            <div class="form_main">
                <form class="contact-form">
                  <label for="name">Name</label>
                  <input type="text" id="name" name="name" required>
            
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" required>
            
                  <label for="message">Message</label>
                  <textarea id="message" name="message" rows="4" required></textarea>
            
                  <button type="submit">Submit</button>
                </form>
            
                <div class="map">
                    <iframe width="100%" height="309px" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
                    src="https://maps.google.com/maps?width=100%25&amp;height=600&amp;hl=en&amp;q=Ambawadi%20+(Coffee%20byus)&amp;t=&amp;z=14&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"></iframe>
                </div>
              </div>
        </div>
    </div>
    <!-- footer -->
    <section class="footer">
        <div class="container">
            <div class="footer_main">
                <div class="icons">
                <i class="fa-brands fa-facebook-f fa_icon"></i>
                <i class="fa-brands fa-instagram fa_icon"></i>
                <i class="fa-brands fa-twitter fa_icon"></i>
                <i class="fa-brands fa-pinterest-p fa_icon"></i>
                <i class="fa-brands fa-tiktok fa_icon"></i>
                <i class="fa-brands fa-whatsapp fa_icon"></i>
                <i class="fa-brands fa-youtube fa_icon"></i>
                </div>
                <h4 class="start">© Start, 2022. All rights reserved.</h4>
            </div>
        </div>
       </section>
    
</body>
</html>
